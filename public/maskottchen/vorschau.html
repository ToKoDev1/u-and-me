<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maskottchen-Vorschau</title>
<style>
  body { font-family: system-ui, sans-serif; background: #FFF4E4; margin: 16px; color: #4A3428; }
  .reihe { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; margin-bottom: 24px; }
  figure { margin: 0; text-align: center; }
  .ganz img { height: 180px; }
  .avatar img { width: 110px; height: 110px; border-radius: 50%; background: #fff; border: 2px solid #F2C98A; }
  .avatar.klein img { width: 40px; height: 40px; }
  .dunkel { background: #2A2320; padding: 16px; border-radius: 16px; }
  .dunkel.avatar img { background: #3A302B; }
</style>
<div class="reihe avatar">
  <img src="loewe-avatar.svg"><img src="hund-avatar.svg"><img src="pinguin-avatar.svg"><img src="elefant-avatar.svg">
</div>
<div class="reihe avatar klein">
  <img src="loewe-avatar.svg"><img src="hund-avatar.svg"><img src="pinguin-avatar.svg"><img src="elefant-avatar.svg">
</div>
<div class="reihe avatar dunkel">
  <img src="loewe-avatar.svg"><img src="hund-avatar.svg"><img src="pinguin-avatar.svg"><img src="elefant-avatar.svg">
</div>
<div class="reihe ganz">
  <figure><img src="loewe.svg"><figcaption>loewe</figcaption></figure>
  <figure><img src="hund.svg"><figcaption>hund</figcaption></figure>
  <figure><img src="pinguin.svg"><figcaption>pinguin</figcaption></figure>
  <figure><img src="elefant.svg"><figcaption>elefant</figcaption></figure>
</div>
<div class="reihe ganz dunkel">
  <img src="loewe.svg"><img src="hund.svg"><img src="pinguin.svg"><img src="elefant.svg">
</div>
